<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Content-Security-Policy (issue #33), also inside the Android app. Scripts and the stylesheet only from the app itself;
     style attributes are needed (colours, positions). connect-src: the packs ('self'), the backend (CONFIG.BACKEND_URL in
     js/config.js, keep both in step), GitHub for app updates, and wrangler dev on localhost. tools/web.mjs sends the
     same policy as a header, plus frame-ancestors, which a meta tag cannot set. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://app.opensprachfuchs.workers.dev https://api.github.com http://localhost:8787; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>OpenSprachFuchs</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<!-- Plain scripts in this order share one global scope; there is no build step. -->
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/state.js"></script>
<script src="js/avatar.js"></script>
<script src="js/account.js"></script>
<script src="js/friends.js"></script>
<script src="js/audio.js"></script>
<script src="js/exercises.js"></script>
<script src="js/lesson.js"></script>
<script src="js/games.js"></script>
<script src="js/qr.js"></script>
<script src="js/views.js"></script>
<script src="js/main.js"></script>
</body>
</html>
