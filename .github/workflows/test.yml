# Checks every push and pull request: language packs, game logic, backend (Node) and the Android debug build.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Sprachpakete, Spiellogik, Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  android:
    name: Android-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --console=plain -PnodePath="$(which node)"
      - uses: actions/upload-artifact@v4
        with:
          name: opensprachfuchs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
